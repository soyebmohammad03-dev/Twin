# Serves the built Vite SPA. All non-asset routes fall back to
# index.html so client-side routing (Twin has no server-rendered
# pages) works on a hard refresh/deep link.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite's hashed filenames are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker itself must always be revalidated — a stale
    # cached sw.js would keep serving an old push-handling script.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
