services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twin_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-twin_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - twin_postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-twin} -d $${POSTGRES_DB:-twin_dev}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  twin_postgres_data:
